<!DOCTYPE html>
<html lang="en">
<head>
  <style>html,body{background:#f7f8fa!important}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind Route Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">
        <div class="logo-icon">MR</div>
        <div>Mind Route<span class="logo-sub">Academy LMS</span></div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="sb-avatar">A</div>
      <div class="user-info">
        <div class="un" id="sb-name">Admin</div>
        <div class="ur">Administrator</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Overview</div>
      <a href="#dashboard" class="nav-item">
        <span class="nav-icon" style="font-family:var(--font-mono);font-weight:700">D</span>Dashboard
      </a>
      <div class="nav-label">Management</div>
      <a href="#students" class="nav-item">
        <span class="nav-icon" style="font-family:var(--font-mono);font-weight:700">S</span>Students
      </a>
      <a href="#teachers" class="nav-item">
        <span class="nav-icon" style="font-family:var(--font-mono);font-weight:700">T</span>Teachers
      </a>
      <a href="#batches" class="nav-item">
        <span class="nav-icon" style="font-family:var(--font-mono);font-weight:700">B</span>Batches
      </a>
      <a href="#tests" class="nav-item">
        <span class="nav-icon" style="font-family:var(--font-mono);font-weight:700">E</span>Entry Tests
      </a>
      <div class="nav-label">Account</div>
      <a href="#" class="nav-item logout" id="logout-btn">
        <span class="nav-icon">→</span>Sign Out
      </a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">Dashboard</span>
      </div>
      <div class="topbar-right">
        <div class="notif-bell-wrap" id="notif-bell-wrap">
          <div class="notif-bell" id="notif-bell">
            <span style="font-size:0.85rem">🔔</span>
            <div class="notif-count" id="notif-count" style="display:none">0</div>
          </div>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-header">
              <h4>Notifications</h4>
              <button onclick="markAllRead()">Mark all read</button>
            </div>
            <div class="notif-list" id="notif-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- THIS IS THE ONLY THING THAT CHANGES -->
    <div id="page-content" class="page-content"></div>
  </div>

</div>
<script src="../js/app.js"></script>
</body>
</html>
