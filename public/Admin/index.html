<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind Route Admin</title>
  <!--
    RETIRED PAGE — kept only as a redirect.

    This used to be a hash-routing single-page shell (#dashboard, #students,
    #batches ...) driven by ADMIN_ROUTES / navigateTo() / initAdminSPA() in
    app.js. The Admin section is now real separate .html files, exactly like
    Student/ and Teacher/.

    Keeping the old shell live was actively harmful: because it was the admin's
    login landing page AND it contained <div id="page-content">, it booted the
    dead SPA instead of the real pages. Its sidebar had no Courses entry at all,
    which is why there appeared to be no way to create a course. setupSidebar()
    also deliberately skips href="#..." links, so nav highlighting never worked
    here either.

    Anything still pointing at Admin/index.html lands on the real dashboard now.
  -->
  <meta http-equiv="refresh" content="0; url=dashboard.html" />
  <script>window.location.replace('dashboard.html');</script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem;color:#555">
    Redirecting to the admin dashboard&hellip;
    If nothing happens, <a href="dashboard.html">open it directly</a>.
  </p>
</body>
</html>
